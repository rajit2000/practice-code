<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: coral;
            height: 150px;
        }
        .box{
            text-align: center;
            justify-content: center;
            border: 2px solid black;
            height: 150px;
            width: 150px;
            background-color: aqua;
            margin: 100px;
            border-radius: 50%;
        }
        .box:hover{
            transform: rotate(260deg) scale(1);
            background-color: brown;
            transition :5s;
            translate: 1000px;
        }
        .ball{
            border: 1px solid black;
            width: 10px;
            height: 100px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box"><img src="https://th.bing.com/th/id/OIP.GM5pMN5lqh3NtJ_Oh4bWjAHaHa?w=186&h=186&c=7&r=0&o=5&dpr=2&pid=1.7" alt=""></div></div>
    </div>
    
</body>
</html>
