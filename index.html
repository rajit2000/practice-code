<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            height: 300px;
            width: 700px;
            background-color: aqua;
        }
        .box{
            border-radius: 50px;
            height: 80px;
            width: 80px;
            background-color:red;
            position: absolute;
            left: 0;
            bottom: 0;
            animation: animateX 5s linear infinite , animateY 1s ease-out infinite alternate;
        }

    @keyframes animateX{
        from{
          left: 0%;
        }
      to{
left: 100%;
background-color: black;
      }  
    }
    @keyframes animateY {
        from{
            bottom: 0%;
        }
        to{
            bottom: 100%;
            background-color: green;
        }
        
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
